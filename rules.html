<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Rush Rules</title>
<style>
  @font-face { font-family: 'RuneScape Plain 12'; src: url('fonts/runescape-plain-12.ttf') format('truetype'); font-display: swap; }
  body { margin: 0; padding: 24px 16px 48px; background: #0f110f; color: #fff; font: 20px/1.4 'RuneScape Plain 12', Arial, sans-serif; }
  .page { max-width: 760px; margin: 0 auto; }
  h1, h2, h3 { font-weight: normal; color: #ffff00; text-shadow: 2px 2px 0 #000; line-height: 1.2; }
  h1 { font-size: 48px; text-align: center; margin: 32px 0 16px; }
  h2 { font-size: 32px; margin: 0; }
  section { background: #181b18; border: 1px solid #333833; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .section-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .section-top[hidden] + .text { margin-top: 0; }
  .text { overflow-wrap: anywhere; }
  .text p { margin: 0; min-height: 1.4em; }
  .text ul { margin: 0; padding-left: 22px; }
  .text li { margin-bottom: 4px; }
  button, .button, textarea { font: 20px 'RuneScape Plain 12', Arial, sans-serif; }
  button, .button { display: inline-block; background: #222622; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
  .back { background: #ffff00; color: #111; border-color: #ffff00; padding: 10px 18px; }
  textarea { box-sizing: border-box; width: 100%; background: #0f110f; color: #fff; border: 1px solid #777; border-radius: 6px; padding: 8px; line-height: 1.4; resize: vertical; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  #status { text-align: center; color: #ffb4a8; min-height: 1.4em; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <a class="button back" href="./">&lt; Back to Tile Rush</a>
  <p id="status" role="status">Loading rules…</p>
  <main id="rules"></main>
  <a class="button back" href="./">&lt; Back to Tile Rush</a>
</div>
<script src="rules.js"></script>
</body>
</html>
