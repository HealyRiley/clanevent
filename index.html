<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WDR's Tile Rush</title>
<style>
  /* Old School RuneScape "Plain 12", built from the CC0 data at github.com/RuneStar/fonts */
  @font-face { font-family: 'RuneScape Plain 12'; src: url('fonts/runescape-plain-12.ttf') format('truetype'); font-display: swap; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .player { position: relative; min-width: 0; }
  .player input { box-sizing: border-box; width: 100%; height: 30px; padding: 2px 30px 2px 8px; background: #181b18; color: #fff; border: 1px solid #3a3f3a; border-radius: 4px; font: 16px 'RuneScape Plain 12', Arial, sans-serif; text-shadow: 1px 1px 0 #000; }
  .player input::placeholder { color: #777; }
  .admin .player input { border-color: #666; }
  /* On the normal site, names can't be clicked, selected or focused */
  body:not(.admin) .player { pointer-events: none; user-select: none; -webkit-user-select: none; }
  .player input:focus-visible { outline: 2px solid #e0b54a; }
  .player.captain input { color: #ffd700; border-color: #ffd700; }
  .crown { display: none; position: absolute; right: 8px; top: 8px; width: 18px; height: 14px; pointer-events: none; }
  .player.captain .crown { display: block; }
  body { margin: 0; padding: 24px 16px; background: #0f110f; color: #eee; font-family: system-ui, sans-serif; }
  h1 { text-align: center; color: #e0b54a; margin: 0 0 4px; }
  .intro { text-align: center; color: #aaa; margin: 0 0 24px; }
  main { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
  section { width: 100%; max-width: 657px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  h2 { margin: 0; font-size: 1.3rem; }
  .count { color: #aaa; font-size: .9rem; margin-left: auto; margin-right: 12px; }
  .reset { background: #222622; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .board { position: relative; }
  .board img { display: block; width: 100%; height: auto; }
  /* Positions are percentages of the 657px board image, so they scale with it */
  .tile { position: absolute; width: 15.07%; height: 15.07%; padding: 0; background: none; border: 0; border-radius: 6px; cursor: default; }
  .tile:enabled { cursor: pointer; }
  .tile:disabled { cursor: not-allowed; }
  .tile.next { outline: 3px dashed #e0b54a; }
  .tile:enabled:not([aria-disabled="true"]):hover, .tile:enabled:focus-visible { outline: 3px solid #e0b54a; }
  /* Expandable tiles can always be right-clicked, even while they're locked */
  .tile[aria-disabled="true"] { cursor: context-menu; }
  .expand-hint { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin: 6px 3% 0 0; color: #ffff00; font: 16px/1.2 'RuneScape Plain 12', Arial, sans-serif; text-shadow: 1px 1px 0 #000; text-align: right; }
  .expand-hint .expand-icon { flex-shrink: 0; width: 22px; height: 22px; }
  #status { text-align: center; color: #ffb4a8; min-height: 1.4em; margin: 0 0 16px; }
  #login, #logout-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 0 0 24px; }
  #login input { background: #181b18; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 7px 10px; font-size: 16px; }
  #login button, #logout { background: #222622; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  /* RuneScape font for the headings, intro and password label */
  h1, h2, .title-input, .intro, #login label { font-family: 'RuneScape Plain 12', Arial, sans-serif; font-weight: normal; }
  h1, h2, .title-input { color: #ffff00; text-shadow: 2px 2px 0 #000; }
  h1 { font-size: 48px; }
  h2, .title-input { font-size: 32px; line-height: 1.2; }
  h2 { min-width: 0; overflow-wrap: anywhere; margin-right: 8px; }
  .intro, #login label { font-size: 16px; }
  .title-input { flex: 1; min-width: 0; width: 100%; margin-right: 8px; padding: 0 6px; background: #181b18; border: 1px dashed #777; border-radius: 4px; }
  .title-input:focus-visible { outline: 2px solid #e0b54a; }
  header .count, header .reset { flex-shrink: 0; }
  /* Title and login stay centred, with the rules button to their right */
  .top { display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; align-items: center; gap: 16px; }
  .top-main { grid-column: 2; }
  .rules-button { grid-column: 3; justify-self: start; font: 32px 'RuneScape Plain 12', Arial, sans-serif; background: #6e6e6e; color: #fff; text-shadow: 2px 2px 0 #000; border: 3px solid; border-color: #a8a8a8 #3d3d3d #3d3d3d #a8a8a8; border-radius: 8px; padding: 14px 24px; text-decoration: none; white-space: nowrap; box-shadow: 0 4px 0 #222; }
  .rules-button:hover, .rules-button:focus-visible { background: #828282; }
  @media (max-width: 1000px) {
    .top { grid-template-columns: minmax(0, 1fr); }
    .top-main, .rules-button { grid-column: 1; }
    .rules-button { justify-self: center; margin-bottom: 28px; }
  }
  #password-area { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 48px; padding-top: 24px; border-top: 1px solid #333; }
  #password-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  #password-form label { display: flex; flex-direction: column; gap: 4px; }
  #password-form input { background: #181b18; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 7px 10px; font-size: 16px; }
  #password-toggle, #password-form button { background: #222622; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  #password-status { margin: 0; text-align: center; min-height: 1.4em; color: #ffb4a8; }
  #password-status.ok { color: #9be29b; }
  [hidden] { display: none !important; }
  .tile .cross { display: none; width: 100%; height: 100%; }
  .tile.crossed .cross { display: block; }
  .expand-icon { background: #111; border: 1px solid #ffff00; border-radius: 4px; }
  .tile .expand-icon { position: absolute; top: 3%; right: 3%; width: 24%; height: 24%; box-sizing: border-box; pointer-events: none; }
  /* Stops phones showing their own menu when a tile is held down */
  .tile.expandable { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
</style>
</head>
<body>
<div class="top">
<div class="top-main">
<h1>WDR's Tile Rush</h1>
<p class="intro" id="intro">Loading…</p>
<form id="login">
  <label for="password">Admin password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<div id="logout-row" hidden><button type="button" id="logout">Log out of admin</button></div>
</div>
<a class="rules-button" href="rules.html">Event Rules</a>
</div>
<p id="status" role="status"></p>
<main id="teams"></main>
<div id="password-area" hidden>
  <button type="button" id="password-toggle" aria-expanded="false" aria-controls="password-form">Change password</button>
  <form id="password-form" hidden>
    <label>Owner password <input type="password" name="owner" autocomplete="off" required></label>
    <label>New admin password <input type="password" name="next" autocomplete="new-password" minlength="8" maxlength="100" required></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" required></label>
    <button type="submit">Save new password</button>
    <p id="password-status" role="status"></p>
  </form>
</div>
<script src="logs-data.js"></script>
<script src="script.js"></script>
</body>
</html>
