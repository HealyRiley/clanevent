<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Log</title>
<style>
  @font-face { font-family: 'RuneScape Plain 12'; src: url('fonts/runescape-plain-12.ttf') format('truetype'); font-display: swap; }
  body { margin: 0; padding: 24px 16px 48px; background: #0f110f; color: #fff; font: 20px/1.4 'RuneScape Plain 12', Arial, sans-serif; }
  .page { max-width: 657px; margin: 0 auto; }
  h1, h2 { font-weight: normal; color: #ffff00; text-shadow: 2px 2px 0 #000; line-height: 1.2; overflow-wrap: anywhere; }
  h1 { font-size: 48px; text-align: center; margin: 24px 0 8px; }
  h2 { font-size: 32px; margin: 20px 0 8px; }
  p { text-align: center; margin: 4px 0; }
  #status { color: #ffb4a8; min-height: 1.4em; }
  .back { display: inline-block; background: #ffff00; color: #111; border-radius: 6px; padding: 10px 18px; text-decoration: none; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; background: #181b18; border: 1px solid #333833; border-radius: 8px; padding: 8px; }
  .item { width: calc((100% - 18px) / 4); position: relative; aspect-ratio: 1; padding: 0; background: #22261f; border: 0; border-radius: 6px; cursor: pointer; overflow: hidden; }
  .item:disabled { cursor: default; }
  .item:enabled:hover, .item:focus-visible { outline: 3px solid #e0b54a; }
  .item img { position: absolute; left: 15%; top: 5%; width: 70%; height: 66%; object-fit: contain; image-rendering: pixelated; }
  .smooth .item img { image-rendering: auto; }
  .item span { position: absolute; left: 6px; right: 4px; bottom: 5px; text-align: left; color: #fff; font: bold 13px/1.2 system-ui, Arial, sans-serif; text-shadow: 1px 1px 2px #000; }
  .item svg { display: none; position: absolute; inset: 0; width: 100%; height: 100%; }
  .item.crossed svg { display: block; }
  @media (max-width: 480px) { .item span { font-size: 11px; left: 4px; } }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="./">&lt; Back to Tile Rush</a>
  <h1 id="title">Item Log</h1>
  <p id="tile-number"></p>
  <p>Click an item to cross it off, in any order. Click it again to undo.</p>
  <p id="count"></p>
  <p id="status" role="status">Loading…</p>
  <main id="log"></main>
  <p><a class="back" href="./">&lt; Back to Tile Rush</a></p>
</div>
<script src="logs-data.js"></script>
<script src="log.js"></script>
</body>
</html>
